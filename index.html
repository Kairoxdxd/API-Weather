<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test doc</title>
    <link rel="stylesheet" href="css/test.css" />
  </head>
  <body>
    <dialog id="history" class="history">
      <header class="history_head">
        <h3>История погоды</h3>
        <button class='history__btn' id="historyClose" aria-label="Закрыть историю погоды">×</button>
      </header>
      <ul id="history-list" class="history__ul"></ul>
    </dialog>
    <div class="app">
      <header class="app__header">
        <button class="app__header-btn" id='historyOpen' aria-label="Открыть">История</button>
      </header>
      <h1>Погода</h1>
      <div class="app__body">
      <form class="app__search-city" id="app__form">
        <input
          type="text"
          class="app__input"
          placeholder="Введите свой город"
          id="app__input"
        />
        <button type="submit" id="app__submit" class="app__btn">Узнать</button>
      </form>
      <div class="app__footer" id="result">
      </div>
      </div>
    </div>
   <script src="scripts/main.js" type="module"></script>
  </body>
</html>
